info:
  name: Suche id, version, nachname, ... von allen mieteren
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      {
        mieteren(suchparameter: null) {
          id
          version
          vorname
          nachname
          email
          telefonnummer
          geburtsdatum
          mietvertrag {
            seitenAnz
            kaution
          }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body mit den Properties', () => {
          res.getBody()
            .data
            .mieteren
            .forEach(mieter => {
              const { id, version, nachname, email, kategorie, hasNewsletter, geburtsdatum, homepage, geschlecht, familienstand, adresse, fachaerzte, username } = mieter;
              expect(id).to.be.gte(0);
              expect(version).to.be.gte(0);
              expect(nachname).to.be.a('string').that.is.not.empty;
              expect(email).to.be.a('string').that.is.not.empty;
              expect(kategorie).to.be.gte(0);
              expect(hasNewsletter).to.be.a('boolean');
              expect(geburtsdatum).to.be.a('string');
              expect(homepage).to.be.a('string');
              expect(geschlecht).to.be.a('string');
              expect(familienstand).to.be.a('string');
              expect(adresse).to.be.an('object').that.is.not.empty;
              expect(fachaerzte).to.be.an('array');
              expect(username).to.be.a('string').that.is.not.empty;
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.mieteren
      operator: isArray
    - expression: res.body.data.mieteren
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
