info:
  name: Suche nachname, email, ... vom mieteren mit ID 2
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($mieterId: ID! = 99999) {
        mieter(mieterId: $mieterId) {
          id
          version
          vorname
          nachname
          email
          telefonnummer
          geburtsdatum
          mietvertrag {
            seitenAnz
            kaution
          }
        }
      }
    variables: |-
      {
        "mieterId": "2"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.mieter
      operator: isJson
    - expression: res.body.data.mieter.version
      operator: gte
      value: "0"
    - expression: res.body.data.mieter.nachname
      operator: isString
    - expression: res.body.data.mieter.nachname
      operator: isNotEmpty
    - expression: res.body.data.mieter.email
      operator: isString
    - expression: res.body.data.mieter.email
      operator: isNotEmpty
    - expression: res.body.data.mieter.kategorie
      operator: gt
      value: "0"
    - expression: res.body.data.mieter.hasNewsletter
      operator: isBoolean
    - expression: res.body.data.mieter.geburtsdatum
      operator: isString
    - expression: res.body.data.mieter.homepage
      operator: isString
    - expression: res.body.data.mieter.geschlecht
      operator: isString
    - expression: res.body.data.mieter.familienstand
      operator: isString
    - expression: res.body.data.mieter.adresse
      operator: isJson
    - expression: res.body.data.mieter.fachaerzte
      operator: isArray
    - expression: res.body.data.mieter.username
      operator: isString
    - expression: res.body.data.mieter.username
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
