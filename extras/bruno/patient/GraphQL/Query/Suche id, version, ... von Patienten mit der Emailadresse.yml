info:
  name: Suche id, version, ... von mieteren mit der Emailadresse
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($email: String = "alice@acme.com") {
        mieter(suchparameter: {email: $email}) {
          id
          version
          vorname
          nachname
          email
          telefonnummer
          geburtsdatum
          mietvertrag {
            seitenAnz
            kaution
          }
        }
      }
    variables: |-
      {
        "email": "admin@acme.com"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.mieteren
      operator: isArray
    - expression: res.body.data.mieteren
      operator: length
      value: "1"
    - expression: res.body.data.mieteren[0]
      operator: isJson
    - expression: res.body.data.mieteren[0].id
      operator: gte
      value: "0"
    - expression: res.body.data.mieteren[0].version
      operator: gte
      value: "0"
    - expression: res.body.data.mieteren[0].nachname
      operator: isString
    - expression: res.body.data.mieteren[0].nachname
      operator: isNotEmpty
    - expression: res.body.data.mieteren[0].kategorie
      operator: gte
      value: "0"
    - expression: res.body.data.mieteren[0].hasNewsletter
      operator: isBoolean
    - expression: res.body.data.mieteren[0].geschlecht
      operator: isString
    - expression: res.body.data.mieteren[0].homepage
      operator: isString
    - expression: res.body.data.mieteren[0].geschlecht
      operator: isString
    - expression: res.body.data.mieteren[0].familienstand
      operator: isString
    - expression: res.body.data.mieteren[0].adresse
      operator: isJson
    - expression: res.body.data.mieteren[0].fachaerzte
      operator: isArray
    - expression: res.body.data.mieteren[0].username
      operator: isString
    - expression: res.body.data.mieteren[0].username
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
