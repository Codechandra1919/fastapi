info:
  name: Neuer mieter mit ungültigen Daten
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      mutation {
        create(
          mieterInput: {
            vorname: "Vornamerest"
            nachname: "Nachnamerest"
            email: "falschhh@"
            telefonnummer: "+49 111 000000"
            geburtsdatum: "1990-01-01"
            mietvertrag: {
              seitenAnz: 12
              kaution: "1500.00"
            },
            mietrechnungen: [{
                betrag: "999.99"
                waehrung:  "EUR"
              }]
            username: "testrestttt"
          }
        ) {
          id
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Fehlermeldungen in "validation_errors"', () => {
            const props = ['nachname', 'email', 'homepage', 'geschlecht', 'plz', 'waehrung'];
          
            res.getBody()
                .errors[0]
                .extensions
                .validation_errors
                .map(err => err.field)
                .forEach(field => {
                    const matches = props.some(prop => field.includes(prop));
                    expect(matches).to.be.true;
                });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.errors
      operator: isArray
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].message
      operator: contains
      value: nachname
    - expression: res.body.errors[0].message
      operator: contains
      value: email
    - expression: res.body.errors[0].message
      operator: contains
      value: homepage
    - expression: res.body.errors[0].message
      operator: contains
      value: adresse
    - expression: res.body.errors[0].message
      operator: contains
      value: rechnungen
    - expression: res.body.errors[0].path
      operator: isArray
    - expression: res.body.errors[0].path
      operator: length
      value: "1"
    - expression: res.body.errors[0].path[0]
      operator: eq
      value: create
    - expression: res.body.errors[0].extensions.validation_errors
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
