info:
  name: Neuer mieter
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      mutation {
        create(
          mieterInput: {
            vorname: "Vornamerest"
            nachname: "Nachnamerest"
            email: "testresttt@acme.com"
            telefonnummer: "+49 111 000000"
            geburtsdatum: "1990-01-01"
            mietvertrag: {
              seitenAnz: 12
              kaution: "1500.00"
            },
            mietrechnungen: [{
                betrag: "999.99"
                waehrung:  "EUR"
              }]
            username: "testrestttt"
          }
        ) {
          id
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data
      operator: isJson
    - expression: res.body.data.create.id
      operator: gte
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
