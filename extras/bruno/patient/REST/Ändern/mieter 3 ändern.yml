info:
  name: mieter 3 ändern
  type: http
  seq: 1

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: '"0"'
  params:
    - name: id
      value: "3"
      type: path
  body:
    type: json
    data: |-
      {
          "vorname": "Vornamealphaput",
          "nachname": "Nachnamealphaput",
          "email": "alpha@acme.de.put",
          "telefonnummer": "+49 111 000000",
          "geburtsdatum": "1990-01-01"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
