info:
  name: mieter 3 mit bereits existierender Emailadresse ändern
  type: http
  seq: 7

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: If-Match
      value: '"1"'
  params:
    - name: id
      value: "3"
      type: path
  body:
    type: json
    data: |-
      {
          "vorname": "Vornamealphaput",
          "nachname": "Nachnamealphaput",
          "email": "alice@acme.de",
          "telefonnummer": "+49 111 000000",
          "geburtsdatum": "1990-01-01"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.detail
      operator: contains
      value: Email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
