info:
  name: Neuer mieter
  type: http
  seq: 1

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
            "vorname": "Vornamerest",
            "nachname": "Nachnamerest",
            "email": "testrest@acme.com",
            "telefonnummer": "+49 111 000000",
            "geburtsdatum": "1990-01-01",
            "mietvertrag": {
              "seiten_anz": 12,
              "kaution": "1500.00"
            },
            "mietrechnungen": [
              {
                "betrag": "999.99",
                "waehrung":  "EUR"
              }
            ],
            "username": "testrest"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers.location
      operator: matches
      value: \/rest\/[1-9]\d*$
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
