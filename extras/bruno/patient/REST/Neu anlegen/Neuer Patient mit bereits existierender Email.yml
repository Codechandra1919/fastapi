info:
  name: Neuer mieter mit bereits existierender Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
            "vorname": "Vornamerest",
            "nachname": "Nachnamerest",
            "email": "alice@acme.de",
            "telefonnummer": "+49 111 000000",
            "geburtsdatum": "1990-01-01",
            "mietvertrag": {
              "seiten_anz": 12,
              "kaution": "1500.00"
            },
            "mietrechnungen": [
              {
                "betrag": "999.99",
                "waehrung":  "EUR"
              }
            ],
            "username": "Vornamerest"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.body.detail
      operator: contains
      value: Email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
