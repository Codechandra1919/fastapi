info:
  name: Suche id, version, nachname, ... von allen Mietern
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      {
        mieterListe(suchparameter: null) {
          id
          version
          vorname
          nachname
          email
          telefonnummer
          geburtsdatum
          mietvertrag {
            seitenAnz
            kaution
          }
          username
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body mit den Properties', () => {
          res.getBody()
            .data
            .mieterListe
            .forEach(mieter => {
              const { id, version, vorname, nachname, email, geburtsdatum, mietvertrag, username } = mieter;
              expect(id).to.be.gte(0);
              expect(version).to.be.gte(0);
              expect(vorname).to.be.a('string').that.is.not.empty;
              expect(nachname).to.be.a('string').that.is.not.empty;
              expect(email).to.be.a('string').that.is.not.empty;
              expect(geburtsdatum).to.be.a('string');
              expect(mietvertrag).to.be.an('object');
              expect(mietvertrag.seitenAnz).to.be.gte(0);
              expect(username).to.be.a('string').that.is.not.empty;
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.mieterListe
      operator: isArray
    - expression: res.body.data.mieterListe
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
