info:
  name: Suche nachname, email, ... vom Mieter mit ID 1
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($mieterId: ID! = "1") {
        mieter(mieterId: $mieterId) {
          id
          version
          vorname
          nachname
          email
          telefonnummer
          geburtsdatum
          mietvertrag {
            seitenAnz
            kaution
          }
          username
        }
      }
    variables: |-
      {
        "mieterId": "1"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.mieter
      operator: isJson
    - expression: res.body.data.mieter.version
      operator: gte
      value: "0"
    - expression: res.body.data.mieter.nachname
      operator: isString
    - expression: res.body.data.mieter.nachname
      operator: isNotEmpty
    - expression: res.body.data.mieter.email
      operator: isString
    - expression: res.body.data.mieter.email
      operator: isNotEmpty
    - expression: res.body.data.mieter.geburtsdatum
      operator: isString
    - expression: res.body.data.mieter.mietvertrag
      operator: isJson
    - expression: res.body.data.mieter.mietvertrag.seitenAnz
      operator: gte
      value: "0"
    - expression: res.body.data.mieter.username
      operator: isString
    - expression: res.body.data.mieter.username
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
