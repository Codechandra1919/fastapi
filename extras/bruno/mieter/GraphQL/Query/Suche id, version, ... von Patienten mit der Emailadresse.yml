info:
  name: Suche id, version, ... von Mietern mit der Emailadresse
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query ($email: String = "admin@acme.com") {
        mieterListe(suchparameter: {email: $email}) {
          id
          version
          vorname
          nachname
          email
          telefonnummer
          geburtsdatum
          mietvertrag {
            seitenAnz
            kaution
          }
          username
        }
      }
    variables: |-
      {
        "email": "admin@acme.com"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data.mieterListe
      operator: isArray
    - expression: res.body.data.mieterListe
      operator: isNotEmpty
    - expression: res.body.data.mieterListe[0]
      operator: isJson
    - expression: res.body.data.mieterListe[0].id
      operator: gte
      value: "0"
    - expression: res.body.data.mieterListe[0].version
      operator: gte
      value: "0"
    - expression: res.body.data.mieterListe[0].vorname
      operator: isString
    - expression: res.body.data.mieterListe[0].vorname
      operator: isNotEmpty
    - expression: res.body.data.mieterListe[0].nachname
      operator: isString
    - expression: res.body.data.mieterListe[0].nachname
      operator: isNotEmpty
    - expression: res.body.data.mieterListe[0].email
      operator: isString
    - expression: res.body.data.mieterListe[0].email
      operator: isNotEmpty
    - expression: res.body.data.mieterListe[0].mietvertrag
      operator: isJson
    - expression: res.body.data.mieterListe[0].mietvertrag.seitenAnz
      operator: gte
      value: "0"
    - expression: res.body.data.mieterListe[0].username
      operator: isString
    - expression: res.body.data.mieterListe[0].username
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
