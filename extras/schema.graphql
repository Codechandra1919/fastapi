# Mit z.B. "Bun" extrahieren:
#   $env:NODE_TLS_REJECT_UNAUTHORIZED='0'
#   bunx get-graphql-schema https://localhost:8000/graphql > schema.graphql

schema {
  query: Query
  mutation: Mutation
}

"Suche nach mieterendaten"
type Query {
  "Suche mieterendaten anhand der ID"
  mieter(mieterId: ID!): mieter

  "Suche mieterendaten anhand des Nachnamens oder der Emailadresse"
  mieteren(suchparameter: Suchparameter): [mieter!]!
}

type Mutation {
  "Einen neuen mieterendatensatz anlegen"
  create(mieterInput: mieterInput!): CreatePayload!

  "Token zu Benutzername und Passwort anfordern"
  login(username: String!, password: String!): LoginResult!
}

# https://spec.graphql.org/draft/#sec-Types
# https://www.graphql-scalars.dev/docs/scalars/email-address
# https://www.graphql-scalars.dev/docs/scalars/local-date
# https://www.graphql-scalars.dev/docs/scalars/currency
# enum als String, damit toSting() vom Enum-Wert aufgerufen wird
"Eigenschaften eines mieter-Datensatzes mit untergeordneten Eigenschaften"
type mieter {
  id: ID!
  vorname: String!
  nachname: String!
  email: String!
  telefon: String!
  geburtsdatum: Date!
  mietvertrag: Mietvertrag!
  username: String
}

type Mietvertrag {
  seiten_anz: String!
  kaution: String!
}

# https://spec.graphql.org/draft/#sec-Input-Objects
"Suchparameter für die Query 'mieteren'"
input Suchparameter {
  nachname: String = null
  email: String = null
}

input mieterInput {
 id: ID!
  vorname: String!
  nachname: String!
  email: String!
  telefon: String!
  geburtsdatum: Date!
  mietvertrag: Mietvertrag!
  username: String
}

input MietvertragInput {
  seiten_anz: String!
  kaution: String!
}

input MietrechnungInput {
  betrag: Decimal!
  waehrung: String!
}

type CreatePayload {
  id: Int!
}

type LoginResult {
  token: String!
  expiresIn: String!
  roles: [String!]!
}
